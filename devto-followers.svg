<svg width="360" height="90" viewBox="0 0 360 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DEV.to followers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="360" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="30" x2="240" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="358" height="88" rx="14" fill="url(#bg)" stroke="#3b4261" stroke-width="1.5"/>

  <!-- DEV logo -->
  <rect x="22" y="25" width="40" height="40" rx="8" fill="#0A0A0A" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="42" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DEV</text>

  <!-- follower count (updated by GitHub Action) -->
  <text id="followers-count" x="80" y="53" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="url(#accent)">20,815</text>
  <text x="80" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9b1d6" letter-spacing="1.5">FOLLOWERS ON DEV.TO</text>

  <!-- heart -->
  <path transform="translate(312, 32) scale(1.1)" fill="#f7768e" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
